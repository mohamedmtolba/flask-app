---
- name: "Automate docker build using Ansible"
  hosts: localhost
  tasks:
  - name: stop running container
    command: docker stop flask-app1
    ignore_errors: yes

  - name: remove stopped container
    command: docker rm flask-app1
    ignore_errors: yes
  
  - name: remove used image
    command: docker rmi mohamedmtolba/flask-app
    ignore_errors: yes
    
  - name: build new image 
    command: docker build -t mohamedmtolba/flask-app .

  - name: run new container
    command: docker run -it -d --name flask-app -p 6000:6000 mohamedmtolba/flask-app

  - name: push docker image 
    command: docker push mohamedmtolba/flask-app

